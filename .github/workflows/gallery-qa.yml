name: Gallery release QA
on:
  push:
    branches: [feature/immersive-project-gallery, feature/portfolio-professional-v15]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gallery-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          node scripts/gallery-smoke.mjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-visual-qa
          path: artifacts/gallery
          if-no-files-found: ignore
          retention-days: 7
